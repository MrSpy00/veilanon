[package]
name = "veilanon"
version = "0.0.1"
description = "veilanon — Privacy-first, open-source desktop communication platform by aegisSoft"
authors = ["aegisSoft <aegissoft0@gmail.com>"]
repository = "https://github.com/MrSpy00/veilanon"
license = "AGPL-3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "veilanon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "veilanon"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
chrono = "0.4"

[dependencies]
# ── Tauri Core ──────────────────────────────────────────────────────────────
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# ── Environment (.env loading for dev; secrets never logged) ─────────────────
dotenvy = "0.15"

# ── Async Runtime ────────────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
# native-tls (schannel/OpenSSL) for the realtime WebSocket: rustls' TLS
# fingerprint is flagged by Cloudflare in front of Supabase (HTTP 400).
tokio-native-tls = "0.3"
native-tls = "0.2"
futures-util = "0.3"

# ── Serialization ────────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Cryptography (zero custom crypto — audited libs only) ───────────────────
ring = "0.17"                          # AES-256-GCM, HKDF, SHA-2, random
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets", "serde"] }
chacha20poly1305 = "0.10"             # ChaCha20-Poly1305 for file encryption
argon2 = "0.5"                         # Password/passphrase hashing
zeroize = { version = "1", features = ["derive"] }  # Key material cleanup
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
hex = "0.4"

# ── Double Ratchet (1:1 DM E2EE) ─────────────────────────────────────────────
# Using our own implementation wrapper around ring primitives
# (openmls handles groups; custom ratchet for DM to avoid heavy libsignal dep)

# ── MLS Group E2EE (RFC 9420) ─────────────────────────────────────────────────
# openmls 0.8 depends on openmls_traits 0.5; provider crates must match that
# trait version. The hpke-rs 0.6 chain replaces the vulnerable 0.2 chain
# (RUSTSEC-2026-0069..0072 — KDF/nonce-reuse advisories).
openmls = "0.8.1"
openmls_rust_crypto = "0.5.1"
openmls_basic_credential = "0.5.0"
openmls_memory_storage = "0.5.0"
openmls_traits = "0.5.0"
tls_codec = "0.4.2"

# ── LiveKit JWT (HS256) ───────────────────────────────────────────────────────
jsonwebtoken = "9"

# ── Encrypted Local Database ──────────────────────────────────────────────────
# SQLCipher (vendored OpenSSL) requires perl/nasm and is not portable to all
# dev machines. veilanon uses bundled SQLite + application-layer AES-256-GCM
# over sensitive columns (see db::cipher); SQLCipher stays a drop-in option.
rusqlite = { version = "0.32", features = ["bundled"] }

# ── OS Keychain (Credential Store) ───────────────────────────────────────────
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native", "sync-secret-service", "crypto-rust"] }

# ── HTTP Client ──────────────────────────────────────────────────────────────
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "multipart", "socks"] }
url = "2"

# ── UUID / ID Generation ─────────────────────────────────────────────────────
uuid = { version = "1", features = ["v4", "v7", "serde"] }
ulid = { version = "1", features = ["serde"] }

# ── Time ─────────────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

# ── Error Handling ────────────────────────────────────────────────────────────
thiserror = "2"
anyhow = "1"

# ── Logging (no PII leakage; console + rolling file in app data dir) ────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# ── Compression ──────────────────────────────────────────────────────────────
flate2 = "1"
zstd = "0.13"

# ── Regex / Text ──────────────────────────────────────────────────────────────
regex = "1"
once_cell = "1"
sha2 = "0.10"     # SHA-256 hash for update verification

# ── QR Code Generator (offline deterministic SVG) ─────────────────────────────
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# ── System Info (diagnostics only, no user data) ─────────────────────────────
sysinfo = "0.31"

# ── WebView2 COM interop (Windows) ───────────────────────────────────────────
# Media permission auto-grant: microphone/camera/screen prompts are answered
# by the app itself so the WebView2 permission dialog never appears.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# MSVC linker prints ".lib exported" messages to stdout; they are harmless
# bookkeeping and show up as a warning on every build. Suppress them.
[lints.rust]
linker_messages = "allow"

[profile.release]
opt-level = 3           # High performance optimizations
lto = "thin"            # Thin LTO: multi-threaded link-time optimization (3x faster than full LTO)
codegen-units = 16      # Multi-core parallel codegen (utilizes all CPU cores)
panic = "abort"
strip = true            # Strip debug symbols for minimal binary size
