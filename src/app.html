<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>veilanon</title>
    <meta name="description" content="veilanon — Privacy-first open-source communication" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/veilanon-128.png" />
    <meta name="theme-color" content="#0e1016" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('veilanon-theme') || 'dark';
          var resolved = t === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : t;
          document.documentElement.setAttribute('data-theme', resolved);
          var p = localStorage.getItem('veilanon-preset') || 'veil-origin';
          document.documentElement.setAttribute('data-preset', p);
          if (localStorage.getItem('veilanon-amoled') === 'true' && resolved === 'dark') {
            document.documentElement.setAttribute('data-amoled', 'true');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Security: No external scripts in head -->
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="veil-root">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
